[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "source_data: requires registered third-party source files",
  "generated_data: requires pipeline outputs generated from registered source files",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["outputs", "sources/incoming", "work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["UP038"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
